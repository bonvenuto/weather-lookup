<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Lookup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <main class="app">
      <header class="header">
        <p class="eyebrow">Local lookup</p>
        <h1>Weather</h1>
        <p class="lede">Search a city, or use your location.</p>
      </header>

      <form class="search" id="search-form" autocomplete="off">
        <label class="sr-only" for="city">City</label>
        <input
          id="city"
          name="city"
          type="search"
          placeholder="Lisbon, Tokyo, Recife…"
          required
        />
        <button type="submit">Look up</button>
        <button type="button" id="geo-btn" class="ghost" title="Use my location">
          Near me
        </button>
      </form>

      <p class="status" id="status" role="status" hidden></p>

      <section class="result" id="result" hidden>
        <div class="now">
          <div>
            <h2 id="place"></h2>
            <p class="when" id="when"></p>
          </div>
          <div class="temp-block">
            <p class="temp" id="temp"></p>
            <p class="condition" id="condition"></p>
          </div>
        </div>
        <ul class="stats">
          <li><span>Feels like</span><strong id="feels"></strong></li>
          <li><span>Humidity</span><strong id="humidity"></strong></li>
          <li><span>Wind</span><strong id="wind"></strong></li>
          <li><span>High / low</span><strong id="range"></strong></li>
        </ul>
        <h3 class="forecast-title">Next days</h3>
        <ol class="forecast" id="forecast"></ol>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
